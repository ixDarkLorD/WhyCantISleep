modLoader = "javafml"
loaderVersion = "[${min_forge_fml_version},)"
issueTrackerURL = "${mod_issue_url}"
license = "${mod_license}"

[[mods]]
modId = "${modid}"
displayName = "${mod_name}"
version = "${version}"
description = "${mod_description}"
authors = "${mod_author}"
displayURL = "${mod_page_url}"
updateJSONURL = "${mod_forge_update_url}"
displayTest = "${mod_forge_display_test}"

[[dependencies.${modid}]]
modId = "forge"
mandatory = true
versionRange = "[${min_forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "minecraft"
mandatory = true
versionRange = "[${mc_version},) , (,${max_mc_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "coolcatlib"
mandatory = true
versionRange = "[${coolcatlib_version},)"
ordering = "AFTER"
side = "BOTH"

# The guide book is a Folios book.
[[dependencies.${modid}]]
modId = "folios"
mandatory = true
versionRange = "[${folios_min_version},)"
ordering = "NONE"
side = "BOTH"

# Simple Voice Chat, optional: a hiding player's voice is muffled by their spot, and is noise that gives them away.
[[dependencies.${modid}]]
modId = "voicechat"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "BOTH"
