apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/fabric.gradle"

dependencies {
    // CoolCatLib: Core (Fabric). Its common classes are inside this jar.
    implementation "net.ixdarklord.coolcatlib:coolcatlib-core-fabric:${coolcatlib_version}"
    // CoolCatLib: Canvas (Fabric). Its common classes are inside this jar.
    implementation "net.ixdarklord.coolcatlib:coolcatlib-canvas-fabric:${coolcatcanvas_version}"

    // Dev runs only, never published: MCP Bridge lets the game be driven from outside. Not transitive, because it still points
    // at CoolCatLib's old coordinates and would load a second copy of it.
    localRuntime("net.ixdarklord.mcp_bridge:mcp_bridge-fabric:${mcp_bridge_version}") { transitive = false }
}
