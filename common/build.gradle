apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/common.gradle"

repositories {
    // Simple Voice Chat's API, for the optional integration (compat/voicechat).
    maven {
        url = "https://maven.maxhenkel.de/repository/public"
        content { includeGroup "de.maxhenkel.voicechat" }
    }
    // WTHIT's API, for the optional tooltip lines (compat/wthit).
    maven {
        url = "https://maven4.bai.lol"
        content { includeGroup "mcp.mobius.waila" }
    }
}

dependencies {
    // CoolCatLib (common): mod constructors, events, networking, configs, attachments, platform checks
    compileOnly "net.ixdarklord.coolcatlib:coolcatlib-common:${coolcatlib_version}"
    // Folios: the guide book, and giving it to new players (compat/GuideBookGift)
    compileOnly "net.ixdarklord.folios:folios-common:${folios_version}"
    // Simple Voice Chat (optional): a hiding player's voice is muffled by their spot and is noise that gives them away
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    // Jade and WTHIT (optional): a bed's last night and the respawn point, and what soothes or unsettles a sleeper, in their tooltips.
    // Jade has no API jar of its own; its Fabric jar holds the API (unobfuscated, so common compiles against it).
    compileOnly("maven.modrinth:jade:${jade_fabric_version}") { transitive = false }
    compileOnly("mcp.mobius.waila:wthit-api:${wthit_api_version}") { transitive = false }
}

// The shared main.gradle publishes every subproject's shadowJar. For common it must be a plain jar of this
// module's own classes (Shadow's default bundles the whole runtime classpath under an "-all" classifier).
shadowJar {
    configurations = []
    archiveClassifier = null
}
