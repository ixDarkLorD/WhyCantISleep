apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/neoforge.gradle"

dependencies {
    // CoolCatLib (NeoForge). Its common classes are inside this jar.
    modImplementation("net.ixdarklord.coolcatlib:coolcatlib-neoforge:${coolcatlib_version}") { transitive = false }
    // Folios: the mod's guide book is a Folios book.
    modImplementation("net.ixdarklord.folios:folios-neoforge:${folios_version}") { transitive = false }
    // Dev runs only, never published: MCP Bridge lets the game be driven from outside. Not transitive, so it never
    // brings a second CoolCatLib. modLocalRuntime, since 1.21.1 is mapped and the jar must be remapped for dev runs.
    modLocalRuntime("net.ixdarklord.mcp_bridge:mcp_bridge-neoforge:${mcp_bridge_version}") { transitive = false }
    // Dev runs only: Simple Voice Chat, to try the optional integration (Modrinth's maven comes from the shared scripts),
    // remapped like MCP Bridge.
    modLocalRuntime("maven.modrinth:simple-voice-chat:neoforge-${voicechat_version}") { transitive = false }
}
