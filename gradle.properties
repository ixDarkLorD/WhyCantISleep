# ─── Gradle ─────────────────────────────────────────────────────────────────────────────────────────────────────────
# Minecraft decompilation needs the memory; the daemon and build cache keep repeated builds fast.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─── Build ──────────────────────────────────────────────────────────────────────────────────────────────────────────
# The shared version catalog (net.ixdarklord:sharedcatalogs) and the loaders the mod is built for.
dependencies_catalog_version=26.2-v1
project_loaders=fabric,neoforge
project_game_versions=26.2
# The oldest versions the jars accept (the metadata templates read them); the same as CoolCatLib: Core's.
supported_min_mc_version=26.2
supported_min_neoforge_version=26.2.0.84
supported_min_fabric_api_version=0.159.0

# ─── Dev Runs ───────────────────────────────────────────────────────────────────────────────────────────────────────
runtime_min_ram=1G
runtime_max_ram=4G
mixin_debug=false

# ─── Why Can't I Sleep? ─────────────────────────────────────────────────────────────────────────────────────────────
# A plain build number, like CoolCatLib's: versions read <minecraft>-<mod version>, e.g. 26.2-1.
mod_version=0.1.0
modid=whycantisleep
# Maven artifacts: net.ixdarklord.whycantisleep:<mod_maven_name>-<loader>
mod_maven_name=whycantisleep
mod_name=Why Can't I Sleep?
mod_description=Find out what's keeping you awake at night. Highlights the monsters blocking your sleep, points to the ones you can't see, explains every failed sleep, and shows who is still awake.
mod_author=ixDarkLorD
mod_license=MPL-2.0
mod_maven_group=net.ixdarklord
mod_source_url=https://github.com/ixDarkLorD/WhyCantISleep
mod_issue_url=https://github.com/ixDarkLorD/WhyCantISleep/issues
mod_page_url=https://github.com/ixDarkLorD/WhyCantISleep
mod_forge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/forge/whycantisleep.json
mod_neoforge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/neoforge/whycantisleep.json
mod_fabric_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/fabric/whycantisleep.json
# Registers nothing: the client draws everything, and the server sends the exact blockers and runs the sleep board.
mod_environment=*
mod_forge_display_test=MATCH_VERSION

# ─── Publishing ─────────────────────────────────────────────────────────────────────────────────────────────────────
project_release_type=beta
# true uploads nothing, only shows what would be published. Stays true until the first release.
project_upload_debug=true
# Copies each built loader jar to build_jar_output_dir (set in the user's gradle.properties)
copy_build_jar=true
project_curse_id=1743425
project_modrinth_id=9eVeltqz
# Dependencies of the uploaded files, by CurseForge/Modrinth slug: requirement[a,b],optional[c]
fabric_publish_dependencies=requirement[coolcatlib,fabric-api,folios],optional[glazed-menu]
neoforge_publish_dependencies=requirement[coolcatlib,folios],optional[glazed-menu]

# ─── Dependencies ───────────────────────────────────────────────────────────────────────────────────────────────────
# CoolCatLib (both required) and MCP Bridge (dev runs only) are not in the catalog; all come from mavenLocal.
coolcatlib_version=8.0.0+26.2
# Folios (required): the guide book. From Maven Local, published from ../Folios-26.2.
folios_version=3.0.0+26.2
folios_min_version=3.0.0
mcp_bridge_version=1.0.0+26.2
# Simple Voice Chat: its API to compile the optional integration against (compat/voicechat), and the mod itself for dev runs.
voicechat_api_version=2.6.25
voicechat_version=2.6.26+26.2
